name: 日次アウトリーチリマインダー

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日09:00 JST (UTC 00:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: 朝のリマインダー送信（ntfy.sh + メール）
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node seo/daily-reminder.js
