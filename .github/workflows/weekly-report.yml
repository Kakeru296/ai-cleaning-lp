name: 週次ビジネスレポート

on:
  schedule:
    - cron: '0 23 * * 0'  # 毎週月曜 08:00 JST (日曜 UTC 23:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: GSCデータ更新（任意）
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node seo/collect-gsc-data.js || echo "GSCスキップ"

      - name: 週次レポートをメール送信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: node seo/weekly-report.js

      - name: 収益トラッカー（AI分析・LINE通知）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node seo/revenue-tracker.js

      - name: 収益データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo/revenue.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "変更なし"; else
            git commit -m "chore: 週次収益データ更新 $(date '+%Y-%m-%d')"
            git push
          fi
