name: 日次SEO記事自動生成

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST (UTC 21:00)
  workflow_dispatch:
    inputs:
      count:
        description: '生成する記事数'
        default: '25'
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 日次SEOサイクル実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.count || '25' }}
        run: node seo/daily-cycle.js

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml seo/state.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            DATE=$(date +"%Y-%m-%d")
            COUNT=$(git diff --staged --name-only | grep "^blog/" | grep -v "index.html" | wc -l | tr -d ' ')
            git commit -m "feat: ${DATE} SEO記事${COUNT}本自動生成"
            git push
          fi
